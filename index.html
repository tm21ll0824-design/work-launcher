<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作启动台</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="auth-screen" class="auth-screen"><form id="login-form" class="login-card"><h1>工作启动台</h1><p>个人云端工作台</p><label>邮箱<input id="login-email" type="email" required></label><label>密码<input id="login-password" type="password" required></label><button>登录</button><div id="login-message" class="message"></div></form></div>
<main id="app" class="wrap hidden"><header><div><div class="brand-line"><span class="brand-dot"></span><h1>工作启动台</h1></div><div class="sub">GitHub Pages + Supabase</div></div><div class="header-actions"><span id="sync-state">未同步</span><button id="migrate-btn" class="secondary">上传本机旧数据</button><button id="logout-btn" class="secondary">退出登录</button></div></header>
<section class="topbar"><div class="info-card" id="wx-card"><div class="info-dot"></div><div><div class="info-main" id="wx-temp">--°</div><div class="info-sub" id="wx-desc">点击设置城市</div></div></div><div class="info-card"><div class="info-dot blue"></div><div><div class="info-main" id="clock">--:--:--</div><div class="info-sub" id="date">----</div></div></div><div class="info-card"><div class="info-dot amber"></div><div><div class="info-main" id="task-ratio">0/0</div><div class="info-sub">任务完成进度</div></div></div></section>
<section class="panel"><div class="panel-head"><span class="chan">TOOLS</span><span class="panel-title">快捷工具</span></div><input id="tool-search" class="search" placeholder="搜索工具"><div id="tool-panels"></div></section>
<section class="panel"><div class="panel-head"><span class="chan">TASK</span><span class="panel-title">任务清单</span></div><div class="task-add"><input id="todo-input" placeholder="输入新任务，回车添加"><button id="todo-add">添加</button></div><div class="todo-grid"><div><h3>未完成</h3><div id="todo-pending"></div></div><div><h3>已完成</h3><div id="todo-done"></div></div></div></section>
<section class="panel"><div class="panel-head"><span class="chan">NOTE</span><span class="panel-title">信息库</span><span id="note-count"></span></div><div class="note-toolbar"><input id="note-search" placeholder="搜索司机、电话、规则或内容"><select id="note-filter"><option value="">全部分类</option><option>司机资料</option><option>外派规则</option><option>平台规则</option><option>No-show</option><option>常用通知</option><option>机场接机</option><option>公司内部</option><option>临时备忘</option></select><button id="note-add">新增 Note</button></div><div id="note-editor" class="editor hidden"><input id="note-title" placeholder="标题"><select id="note-category"><option>司机资料</option><option>外派规则</option><option>平台规则</option><option>No-show</option><option>常用通知</option><option>机场接机</option><option>公司内部</option><option>临时备忘</option></select><textarea id="note-content" placeholder="内容"></textarea><label class="inline"><input id="note-pinned" type="checkbox">置顶</label><div class="editor-actions"><button id="note-cancel" class="secondary">取消</button><button id="note-save">保存</button></div></div><div id="note-list" class="note-list"></div></section>
<footer>Note 与任务存储于 Supabase；GitHub 仅保存网页代码。</footer></main><script src="config.js"></script><script src="app.js"></script></body></html>
